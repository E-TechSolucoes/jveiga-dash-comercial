*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  /* === PALETA JERONIMO DA VEIGA === */
  --jdv:#1226AA;--jdv-dark:#0a1a8a;--jdv-deep:#06125e;--jdv-light:#2c44d4;
  --bg-app:#e9eef5;
  --ink:#1e293b;--ink-light:#475569;--ink-muted:#94a3b8;
  --white:#ffffff;--snow:#f8fafc;--ice:#f1f5f9;
  --blue:#2563eb;--blue-dark:#1e40af;--blue-deep:#0f172a;
  --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-300:#93c5fd;
  --sky:#0ea5e9;--sky-50:#f0f9ff;--sky-100:#e0f2fe;
  --indigo:#6366f1;--indigo-50:#eef2ff;
  --rose:#f43f5e;--rose-50:#fff1f2;--rose-100:#ffe4e6;
  --amber:#f59e0b;--amber-50:#fffbeb;--amber-100:#fef3c7;
  --emerald:#10b981;--emerald-50:#ecfdf5;--emerald-100:#d1fae5;
  --violet:#8b5cf6;--violet-50:#f5f3ff;--violet-100:#ede9fe;
  --pink:#ec4899;--pink-50:#fdf2f8;--pink-100:#fce7f3;
  --orange:#f97316;--orange-50:#fff7ed;--orange-100:#ffedd5;
  --teal:#14b8a6;--teal-50:#f0fdfa;--teal-100:#ccfbf1;
  --slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;
}
body{font-family:'Poppins',sans-serif;background:var(--bg-app);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;line-height:1.5}
.app{min-height:100vh}

/* ============= HEADER ============= */
.topbar{background:#1226AA;border-bottom:1px solid #0a1a8a;padding:18px 28px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(18,38,170,.15)}
.topbar::before{display:none}
.top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--white);display:flex;align-items:center;justify-content:center;color:#1226AA;font-size:20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.brand-title{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--white);line-height:1.1}
.brand-sub{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:3px}
.top-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top-sel,.top-input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 14px;color:var(--white);font-size:12px;font-weight:500;outline:none;font-family:inherit;transition:.15s}
.top-sel option{background:#1226AA;color:var(--white)}
.top-sel{cursor:pointer;min-width:140px}
.top-sel:hover,.top-input:focus{background:rgba(255,255,255,.2);border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.top-input{width:180px}
.top-input::placeholder{color:rgba(255,255,255,.55)}

/* ============= DATE FILTER (mirrors JDV) ============= */
.date-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.custom-date-wrap{display:none;align-items:center;gap:6px}
.custom-date-wrap.show{display:flex}
.custom-date-wrap label{font-size:10px;color:rgba(255,255,255,.7);font-weight:600}
.custom-date-wrap input[type=date]{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:500;font-family:inherit;outline:none;color:var(--white);background:rgba(255,255,255,.12);cursor:pointer}
.date-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--white);white-space:nowrap;font-weight:600}

/* ============= PILLS ROW ============= */
.pills{display:flex;gap:8px;flex-wrap:wrap;max-width:1440px;margin:14px auto 0}
.pill{padding:7px 14px;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--slate-200);background:var(--white);color:var(--ink-light)}
.pill strong{color:var(--blue);font-weight:700}
.pill--hot{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill--hot strong{color:#fff}
.pill--gold{background:linear-gradient(135deg,var(--amber-50),var(--white));border-color:var(--amber-100);color:#92400e}
.pill--gold strong{color:#92400e}

/* ============= CONTENT ============= */
.content{padding:20px 28px 40px;max-width:1440px;margin:0 auto}

/* ============= XP BAR ============= */
.xp{background:var(--white);border:1px solid var(--slate-200);border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;position:relative;overflow:hidden}
.xp::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--sky))}
.xp-lvl{font-size:13px;font-weight:700;color:var(--blue-deep);min-width:88px;display:flex;align-items:center;gap:8px}
.xp-lvl .lvl-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 8px;border-radius:6px;background:var(--blue-100);color:var(--blue-dark);font-size:11px;font-weight:700}
.xp-prog{flex:1;height:10px;border-radius:6px;background:var(--slate-100);overflow:hidden;position:relative}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--sky));border-radius:6px;transition:width .5s ease}
.xp-txt{font-size:12px;font-weight:700;color:var(--blue);min-width:56px;text-align:right}

/* ============= TABS ============= */
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--white);border:1px solid var(--slate-200);border-radius:12px;padding:5px;flex-wrap:wrap;overflow-x:auto}
.tab-btn{padding:9px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--ink-light);font-family:inherit;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--blue);background:var(--blue-50)}
.tab-btn.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}

/* ============= CARDS ============= */
.card{background:var(--white);border:1px solid var(--slate-200);border-radius:14px;padding:20px;margin-bottom:14px;transition:.15s}
.card:hover{border-color:var(--slate-300)}
.card--blue{border-top:3px solid var(--blue)}
.card--sky{border-top:3px solid var(--sky)}
.card--emerald{border-top:3px solid var(--emerald)}
.card--amber{border-top:3px solid var(--amber)}
.card--rose{border-top:3px solid var(--rose)}
.card--violet{border-top:3px solid var(--violet)}
.card--pink{border-top:3px solid var(--pink)}
.card--orange{border-top:3px solid var(--orange)}
.card-title{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--blue-deep);letter-spacing:-.01em}
.card-title .ct-meta{margin-left:auto;font-size:10px;font-weight:500;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em}

/* ============= KPI GROUPS (containers visuais) ============= */
.kpi-group{background:var(--snow);border:1px solid var(--slate-200);border-radius:14px;padding:18px;margin-bottom:14px;border-left:4px solid var(--blue);transition:.15s}
.kpi-group--funil{border-left-color:var(--blue)}
.kpi-group--perf{border-left-color:var(--violet)}
.kpi-group--funnel-imob{border-left-color:var(--sky)}
.kpi-group--cap-imob{border-left-color:var(--emerald)}
.kpi-group-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.kpi-group-header .grp-icon{font-size:18px;width:38px;height:38px;border-radius:10px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-group--perf .grp-icon{background:var(--violet-50)}
.kpi-group--funnel-imob .grp-icon{background:var(--sky-50)}
.kpi-group--cap-imob .grp-icon{background:var(--emerald-50)}
.kpi-group-title{font-size:14px;font-weight:700;color:var(--blue-deep);letter-spacing:-.01em;line-height:1.2}
.kpi-group-sub{font-size:10px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:3px}

/* ============= GRIDS ============= */
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.g6,.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

/* ============= FUNIL FLOW — setas grandes em badge azul JDV ============= */
.funnel-flow{display:flex !important;align-items:stretch !important;gap:6px !important;flex-wrap:wrap}
.funnel-flow > .stat,.funnel-flow > .stat-hero{flex:1 1 160px;min-width:0}
.flow-arrow{
  flex:0 0 auto;display:flex !important;align-items:center;justify-content:center;
  align-self:center;
  width:34px;height:34px;border-radius:50%;
  background:#1226AA;color:#ffffff;
  box-shadow:0 4px 12px rgba(18,38,170,.4),inset 0 1px 0 rgba(255,255,255,.2);
  font-size:18px;font-weight:900;line-height:1;
  user-select:none;flex-shrink:0;
  font-family:'Poppins',sans-serif;
  text-shadow:0 1px 2px rgba(0,0,0,.2);
  border:2px solid rgba(255,255,255,.3)
}
.flow-arrow::before{content:'➜';display:block;line-height:1}
@media(max-width:700px){
  .funnel-flow > .flow-arrow{transform:rotate(90deg);margin:4px auto}
}

/* ============= STAT CARDS ============= */
.stat{background:var(--white);border:1px solid var(--slate-200);border-radius:12px;padding:14px 16px;transition:.15s;position:relative;overflow:hidden}
.stat:hover{border-color:var(--blue-200);transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,99,235,.06)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--sky))}
.stat .s-icon{font-size:18px;margin-bottom:6px;opacity:.85}
.stat .s-val{font-size:22px;font-weight:700;color:var(--blue);line-height:1.05;letter-spacing:-.02em}
.stat .s-lbl{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin-top:6px}
.stat--emerald::before{background:var(--emerald)} .stat--emerald .s-val{color:var(--emerald)}
.stat--amber::before{background:var(--amber)} .stat--amber .s-val{color:var(--amber)}
.stat--rose::before{background:var(--rose)} .stat--rose .s-val{color:var(--rose)}
.stat--violet::before{background:var(--violet)} .stat--violet .s-val{color:var(--violet)}
.stat--sky::before{background:var(--sky)} .stat--sky .s-val{color:var(--sky)}
.stat--pink::before{background:var(--pink)} .stat--pink .s-val{color:var(--pink)}

/* DESTAQUE de vendas — card especial maior */
.stat-hero{background:linear-gradient(135deg,var(--emerald),#059669);color:#fff;border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;border:none}
.stat-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% -20%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.stat-hero .s-icon{font-size:22px;color:rgba(255,255,255,.9);margin-bottom:6px}
.stat-hero .s-val{color:#fff;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat-hero .s-val .s-target{color:rgba(255,255,255,.6);font-weight:500;font-size:18px}
.stat-hero .s-lbl{color:rgba(255,255,255,.8);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:8px}

/* ============= CASCATA DA META ============= */
.cascade{background:linear-gradient(135deg,#fff,var(--blue-50));border:1px solid var(--blue-100);border-radius:16px;padding:22px 24px;margin-bottom:14px;position:relative;overflow:hidden}
.cascade::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--emerald))}
.cascade-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.cascade-title{font-size:15px;font-weight:700;color:var(--blue-deep);letter-spacing:-.01em}
.cascade-sub{font-size:11px;color:var(--ink-light);margin-top:2px;font-weight:500}
.cascade-row{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:6px}
.cs-stage{flex:1;min-width:140px;background:#fff;border-radius:12px;padding:14px;border:1px solid var(--slate-200);position:relative;display:flex;flex-direction:column;gap:8px}
.cs-stage[data-st="ok"]{border-color:var(--emerald);background:#fff}
.cs-stage[data-st="warn"]{border-color:var(--amber);background:#fff}
.cs-stage[data-st="bad"]{border-color:var(--rose);background:#fff}
.cs-lbl{font-size:10px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em}
.cs-vals{display:flex;align-items:baseline;gap:4px}
.cs-real{font-size:24px;font-weight:700;color:var(--blue-deep);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cs-sep{color:var(--ink-muted);font-weight:300;font-size:18px}
.cs-target{font-size:16px;font-weight:600;color:var(--ink-light);font-variant-numeric:tabular-nums}
.cs-bar{height:6px;border-radius:3px;background:var(--slate-100);overflow:hidden}
.cs-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .5s ease}
.cs-stage[data-st="ok"] .cs-fill{background:linear-gradient(90deg,var(--emerald),#34d399)}
.cs-stage[data-st="warn"] .cs-fill{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.cs-stage[data-st="bad"] .cs-fill{background:linear-gradient(90deg,var(--rose),#fb7185)}
.cs-status{font-size:10px;font-weight:600}
.cs-status.ok{color:#065f46}
.cs-status.warn{color:#92400e}
.cs-status.bad{color:#9f1239}
.cs-arrow{display:none}
.cs-rate{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:1px 8px;font-size:9px;font-weight:700;color:var(--ink-muted);white-space:nowrap}
.cascade-insight{margin-top:18px;padding:12px 16px;border-radius:10px;background:#fff;border:1px solid var(--slate-200);font-size:12px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:10px}
.cascade-insight.warn{background:var(--amber-50);border-color:var(--amber-100);color:#92400e}
.cascade-insight.bad{background:var(--rose-50);border-color:var(--rose-100);color:#9f1239}
.cascade-insight.ok{background:var(--emerald-50);border-color:var(--emerald-100);color:#065f46}
.cascade-edit{font-size:10px;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;display:inline-flex;align-items:center;gap:4px}
.cascade-edit:hover{color:var(--blue-dark)}
.meta-edit-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--blue-100);border-radius:10px;padding:10px 14px;margin-top:14px}
.meta-edit-row label{font-size:11px;font-weight:600;color:var(--ink-light)}
.meta-edit-row input{width:70px;font-size:14px;font-weight:700;color:var(--blue);text-align:center}

/* ============= PROGRESS BAR ============= */
.prog{background:var(--slate-100);border-radius:6px;height:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .5s ease}

/* ============= TABLES ============= */
.table-wrap{margin-top:4px;border-radius:12px;overflow:hidden;border:1px solid var(--slate-200);background:var(--white)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;text-align:left;background:var(--blue-deep);color:#fff;white-space:nowrap}
tbody td{padding:10px 14px;border-bottom:1px solid var(--slate-100);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--blue-50)}

/* ============= BADGES ============= */
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.02em}
.b-green{background:var(--emerald-100);color:#065f46}
.b-blue{background:var(--blue-100);color:var(--blue-dark)}
.b-sky{background:var(--sky-100);color:#075985}
.b-violet{background:var(--violet-100);color:#5b21b6}
.b-gold{background:var(--amber-100);color:#92400e}
.b-red{background:var(--rose-100);color:#9f1239}
.b-gray{background:var(--slate-100);color:var(--ink-light)}
.b-orange{background:var(--orange-100);color:#9a3412}
.b-pink{background:var(--pink-100);color:#9d174d}

/* ============= BUTTONS ============= */
.btn{padding:8px 16px;font-size:12px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-weight:600;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:var(--white);color:var(--blue);border:1px solid var(--slate-200)}
.btn-ghost:hover{border-color:var(--blue);background:var(--blue-50)}
.btn-green{background:var(--emerald);color:#fff}
.btn-green:hover{background:#059669}
.btn-red{background:var(--rose-50);color:var(--rose);border:1px solid var(--rose-100)}
.btn-red:hover{background:var(--rose-100)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}
.btn-validate-day{background:linear-gradient(135deg,#059669,var(--emerald));color:#fff;padding:12px 24px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(16,185,129,.25);border-radius:10px}
.btn-validate-day:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,.35)}
.btn-validate-day:disabled{background:var(--slate-300);cursor:not-allowed;opacity:.7;transform:none;box-shadow:none}

/* ============= FORM ELEMENTS ============= */
input[type=number],input[type=text],input[type=date],select{padding:8px 12px;border-radius:8px;border:1px solid var(--slate-200);font-size:12px;color:var(--ink);background:var(--white);outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
input::placeholder{color:var(--ink-muted)}
input[type=number]{width:64px;text-align:center;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:10px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}

/* ============= TAB CONTENT ============= */
.tc{display:none}
.tc.active{display:block;animation:fadeUp .3s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ============= CHECKLIST ============= */
.ck{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;background:var(--snow);border:1px solid transparent;transition:.15s;font-size:13px;font-weight:500}
.ck:hover{background:var(--blue-50);border-color:var(--blue-100)}
.ck.done{opacity:.5;text-decoration:line-through;background:var(--emerald-50);border-color:var(--emerald-100)}
.ck input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);cursor:pointer}

/* ============= VALIDATION STRIP (checklist) ============= */
.validation-strip{background:linear-gradient(135deg,#fff,var(--emerald-50));border:1px solid var(--emerald-100);border-radius:14px;padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.validation-strip .vs-info{flex:1;min-width:240px}
.validation-strip .vs-title{font-size:13px;font-weight:700;color:#065f46}
.validation-strip .vs-sub{font-size:11px;color:var(--ink-light);margin-top:2px}
.validation-strip.validated{background:linear-gradient(135deg,var(--emerald-50),var(--white))}
.validation-strip.validated .vs-title{color:#065f46}
.validation-log{margin-top:12px;background:var(--white);border:1px solid var(--slate-200);border-radius:10px;padding:12px 14px;font-size:11px;color:var(--ink-light)}
.validation-log strong{color:var(--blue-deep);font-weight:600}
.vlog-item{padding:6px 0;border-bottom:1px solid var(--slate-100);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vlog-item:last-child{border-bottom:none}

/* ============= ARSENAL ============= */
.ar{background:var(--white);border-radius:12px;border:1px solid var(--slate-200);margin-bottom:8px;overflow:hidden;transition:.15s}
.ar:hover{border-color:var(--slate-300)}
.ar.has-val{border-color:var(--emerald);background:linear-gradient(180deg,var(--emerald-50) 0%,var(--white) 40%)}
.ar-header{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ar-header:hover{background:var(--blue-50)}
.ar-body{border-top:1px solid var(--slate-200);padding:18px;background:var(--snow)}
.ar-day{background:var(--white);border-radius:10px;padding:12px 16px;margin-bottom:8px;border:1px solid var(--slate-200)}
.ar-day.validated{border-color:var(--emerald);background:var(--emerald-50)}
.ar-corr-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ar-corr-chip{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--slate-200);background:var(--white);color:var(--ink-light);user-select:none;transition:.15s}
.ar-corr-chip:hover{border-color:var(--blue);color:var(--blue)}
.ar-corr-chip.selected{border-color:var(--emerald);background:var(--emerald-100);color:#065f46}

/* ============= SEMANA NAV ============= */
.sem-nav{display:flex;align-items:center;gap:14px;margin-bottom:16px;background:var(--white);border:1px solid var(--slate-200);border-radius:12px;padding:12px 18px}
.sem-nav-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--slate-200);background:var(--white);cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--blue);transition:.15s}
.sem-nav-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ============= SKINS COMPACT (no Resumo) ============= */
.skins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.sk-mini{background:var(--white);border:1px solid var(--slate-200);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;transition:.15s}
.sk-mini.unlocked{border-color:var(--blue);background:linear-gradient(135deg,var(--blue-50),var(--white))}
.sk-mini.locked{opacity:.5}
.sk-mini-emoji{font-size:20px;width:32px;height:32px;border-radius:8px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sk-mini.unlocked .sk-mini-emoji{background:var(--blue);color:#fff}
.sk-mini-text{flex:1;min-width:0}
.sk-mini-name{font-size:12px;font-weight:700;color:var(--blue-deep);line-height:1.2}
.sk-mini-desc{font-size:10px;color:var(--ink-muted);margin-top:2px;line-height:1.3}

/* ============= EMPTY / MISC ============= */
.empty-state{text-align:center;padding:28px 20px;color:var(--ink-muted);font-weight:500;font-size:13px}
.upload-area{border:1.5px dashed var(--slate-300);border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:var(--snow);transition:.15s}
.upload-area:hover{border-color:var(--blue);background:var(--blue-50)}
.upload-area input[type=file]{display:none}

/* ============= PASTAS ============= */
.pasta-card{background:var(--white);border:1px solid var(--slate-200);border-radius:12px;padding:14px 16px;transition:.15s}
.pasta-card:hover{border-color:var(--blue-200);transform:translateY(-2px);box-shadow:0 6px 20px rgba(37,99,235,.06)}
.pasta-dots{display:flex;gap:3px;margin:10px 0}
.pasta-dot{flex:1;height:6px;border-radius:3px;background:var(--slate-100)}
.pasta-dot.done{background:var(--emerald)}
.pasta-dot.cur{background:var(--amber);animation:dp 1.2s infinite}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.5}}
.doc-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:600;margin:2px}
.dc-ok{background:var(--emerald-100);color:#065f46}
.dc-no{background:var(--rose-100);color:#9f1239}

/* ============= IMOBILIÁRIAS ============= */
.imob-card{background:var(--white);border:1px solid var(--slate-200);border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:.15s}
.imob-card:hover{border-color:var(--blue-200)}

/* ============= STATUS DOTS ============= */
.pending-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:5px;animation:dp 1.2s infinite;vertical-align:middle}
.validated-dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);display:inline-block;margin-right:5px;vertical-align:middle}

/* ============= BANNER ============= */
.integration-warn{background:linear-gradient(135deg,var(--amber-50),#fff);border:1px solid var(--amber-100);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:#92400e}
.integration-warn strong{color:#92400e}
.integration-warn .iw-tag{background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase}

/* ============= SUB-TABS (com cores temáticas) ============= */
.sub-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;background:var(--white);padding:6px;border-radius:12px;border:1px solid var(--slate-200)}
.sub-tab{padding:11px 20px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:12px;background:transparent;color:var(--ink-light);transition:.2s;display:inline-flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:140px;font-family:inherit}
.sub-tab:hover{background:var(--snow);color:var(--ink)}
/* Active states themed by section */
.sub-tab.on--teal{background:linear-gradient(135deg,var(--teal),#0d9488);color:#fff;box-shadow:0 4px 14px rgba(20,184,166,.35)}
.sub-tab.on--violet{background:linear-gradient(135deg,var(--violet),#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.sub-tab.on--rose{background:linear-gradient(135deg,var(--rose),#e11d48);color:#fff;box-shadow:0 4px 14px rgba(244,63,94,.35)}
.sub-tab.on--blue{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.sub-tab.on--emerald{background:linear-gradient(135deg,var(--emerald),#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.sub-tab.on--amber{background:linear-gradient(135deg,var(--amber),#d97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,.3)}
/* old "on" class fallback (used by checklist sub-tabs) */
.sub-tab.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.25)}

/* ============= SELECTORS ============= */
.ob-status-sel{padding:5px 10px;border-radius:6px;border:1px solid var(--slate-200);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;background:var(--white)}

/* ============= KNOWLEDGE CARDS ============= */
.kn-card{background:var(--white);border:1px solid var(--slate-200);border-radius:12px;padding:18px 20px;margin-bottom:12px;transition:.15s}
.kn-card:hover{border-color:var(--blue-200);box-shadow:0 4px 14px rgba(37,99,235,.05)}
.kn-row{display:flex;gap:14px;padding:8px 0;font-size:12px;line-height:1.7;border-bottom:1px solid var(--slate-100)}
.kn-row:last-child{border-bottom:none}
.kn-label{font-weight:700;min-width:110px;color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;padding-top:2px}
.kn-val{flex:1;color:var(--ink)}
.obj-badge{display:inline-block;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600}

/* ============= REGRAS ============= */
.regras-card{background:linear-gradient(135deg,var(--blue-50),var(--sky-50));border:1px solid var(--blue-100)}
.regra-item{padding:8px 0;border-bottom:1px solid var(--blue-100);font-weight:500;font-size:13px;color:var(--blue-deep);display:flex;gap:10px;align-items:center}
.regra-item:last-child{border-bottom:none}
.regra-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;flex-shrink:0}

/* ============= HISTORY ============= */
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;background:var(--snow);margin-bottom:4px;font-size:12px}
.hist-row:hover{background:var(--blue-50)}
.hist-row .hr-date{font-weight:700;color:var(--blue-deep);min-width:80px}
.hist-row .hr-vals{display:flex;gap:14px;color:var(--ink-light);font-weight:500}
.hist-row .hr-vals strong{color:var(--blue);font-weight:700}

/* ============= SCROLLBAR ============= */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--slate-100)}

  {cat:"🤝 Indicações",crit:"Mais indicações da semana (visitas espontâneas NÃO contam)",val:"~R$50",ex:"Carregador portátil, fone Bluetooth, voucher Uber",regra:"Prêmio nas bexigas — corretor estoura para descobrir. Toda terça antes do treino."},

// ========== HELPERS ==========
function fmt(n){return(n||0).toLocaleString('pt-BR');}
function P(a,b){return b>0?Math.round(a/b*100):0;}
function cc(o){return Object.values(o).filter(Boolean).length;}
function ct(o){return Object.keys(o).length;}
function getAK(a,s,d){return a+'_s'+s+'_'+d;}
function cntVals(){var c=0;ARS.forEach(function(a){DIAS.forEach(function(d){var k=getAK(a.id,S.curSem,d);if(S.arsenal[k]&&S.arsenal[k].validated)c++;});});return c;}
function getParts(ci,sem){var t=0,a=0;ARS.forEach(function(ar){DIAS.forEach(function(d){var k=getAK(ar.id,sem,d);var e=S.arsenal[k];if(e&&e.validated&&e.participants&&e.participants.indexOf(ci)!==-1){if(ar.tp==='treinamento')t++;else a++;}});});return{t:t,a:a};}
function calcPts(c){var i=S.corr.indexOf(c);var p=0;DIAS.forEach(function(d){TURNOS.forEach(function(t){if(S.plantao[d+'-'+t+'-'+i])p++;});});var pb=p>=PTS.presBonusMin?PTS.presBonus:0;var pa=getParts(i,S.curSem);var ab=pa.a>=PTS.acaoBonusMin?PTS.acaoBonus:0;return p*PTS.presenca+pb+pa.t*PTS.treino+pa.a*PTS.acao+ab+c.ind*PTS.indicacao+c.vis*PTS.visita+c.pas*PTS.pasta+c.pasA*PTS.pastaAprov+c.v*PTS.venda;}
function nv(p){return p>=150?'Lenda':p>=100?'General':p>=50?'Capitão':'Soldado';}
function nb(p){var c=p>=150?'b-gold':p>=100?'b-violet':p>=50?'b-blue':'b-green';return '<span class="badge '+c+'">'+nv(p)+'</span>';}
function getSemDates(s){var st=new Date(2025,0,6);st.setDate(st.getDate()+(s-1)*7);var en=new Date(st);en.setDate(en.getDate()+5);return st.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' — '+en.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function getAcaoLabel(id){var a=S.acoes.find(function(x){return x.id===id;});return a?a.label:(id||'—');}
function pendingCount(){var c=0;S.outLeads.forEach(function(l){if(!l.validated)c++;});S.roi.forEach(function(r){if(!r.validated)c++;});S.imobs.forEach(function(i){if(!i.validated)c++;});return c;}
function addSync(t,d){console.log('💾 Salvo na Base JV:',t,JSON.parse(JSON.stringify(d)));}
function syncJV(){if(S.pendingSync.length===0){alert('Nada pendente!');return;}console.log('Base JV Payload:',JSON.stringify(S.pendingSync,null,2));alert(S.pendingSync.length+' registros enviados para Base de Dados JV.');S.pendingSync=[];R();}
function statHTML(it){return it.map(function(c){var v='';if(c.acc==='emerald')v=' stat--emerald';else if(c.acc==='amber')v=' stat--amber';else if(c.acc==='rose')v=' stat--rose';else if(c.acc==='violet')v=' stat--violet';else if(c.acc==='sky')v=' stat--sky';else if(c.acc==='pink')v=' stat--pink';return '<div class="stat'+v+'"><div class="s-icon">'+c.i+'</div><div class="s-val">'+c.v+'</div><div class="s-lbl">'+c.l+'</div></div>';}).join('');}
function funnelArrow(){return '<div class="flow-arrow" aria-hidden="true"></div>';}
function funnelHTML(it){return it.map(function(c){var v='';if(c.acc==='emerald')v=' stat--emerald';else if(c.acc==='amber')v=' stat--amber';else if(c.acc==='rose')v=' stat--rose';else if(c.acc==='violet')v=' stat--violet';else if(c.acc==='sky')v=' stat--sky';else if(c.acc==='pink')v=' stat--pink';return '<div class="stat'+v+'"><div class="s-icon">'+c.i+'</div><div class="s-val">'+c.v+'</div><div class="s-lbl">'+c.l+'</div></div>';}).join(funnelArrow());}
function getSkins(){return[

// ========== DATE FILTER (espelhado do JDV) ==========
function fmtDate(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function getDateRange(per){var t=new Date(),from=new Date();if(per==='semana')from.setDate(t.getDate()-6);else if(per==='mes'){from.setDate(1);}else if(per==='ultimo_mes'){from.setMonth(t.getMonth()-1,1);t.setDate(0);}return{from:from,to:t};}
function onCustomDate(){var f=document.getElementById('date-from').value,t=document.getElementById('date-to').value;if(f&&t){document.getElementById('dp-range').textContent=f.split('-').reverse().join('/')+'  →  '+t.split('-').reverse().join('/');R();}}
function onPeriodoChange(){var p=document.getElementById('periodo-sel').value,w=document.getElementById('custom-date-wrap');S.periodo=p;if(p==='custom'){w.classList.add('show');var df=document.getElementById('date-from'),dt=document.getElementById('date-to'),t=new Date();if(!df.value){var wk=new Date();wk.setDate(t.getDate()-6);df.value=wk.toISOString().split('T')[0];}if(!dt.value)dt.value=t.toISOString().split('T')[0];onCustomDate();}else{w.classList.remove('show');var r=getDateRange(p);document.getElementById('dp-range').textContent=fmtDate(r.from)+'  →  '+fmtDate(r.to);R();}}

// ========== CASCATA DA META ==========
function calcCascade(meta){
  var pas=Math.ceil(meta/S.taxas.pv);
  var vis=Math.ceil(pas/S.taxas.vp);
  var leads=Math.ceil(vis/S.taxas.lv);
  return{vendas:meta,pastas:pas,visitas:vis,leads:leads};
}
function setMetaVendas(v){S.meta.vendas=Math.max(1,+v||1);R();}

function go(id){document.querySelectorAll('.tc').forEach(function(e){e.classList.remove('active');});document.querySelectorAll('.tab-btn').forEach(function(e){e.classList.remove('active');});document.getElementById('t-'+id).classList.add('active');document.getElementById('tb-'+id).classList.add('active');R();}
function navSem(d){S.curSem=Math.max(1,S.curSem+d);R();}
function setArsF(f){S.arsF=f;renderArsenal();}
function setKnSub(s){S.knSub=s;renderConhecimento();}
function setCkSub(s){S.ckSub=s;renderChecklist();}
function init(){
  Object.keys(CKB).forEach(function(k){if(S.ckb[k]===undefined)S.ckb[k]=false;});
  Object.keys(CKD).forEach(function(k){if(S.ckd[k]===undefined)S.ckd[k]=false;});
  var th='';TAB_LIST.forEach(function(t,i){th+='<button class="tab-btn'+(i===0?' active':'')+'" id="tb-'+t.id+'" onclick="go(\''+t.id+'\')">'+t.label+'</button>';});

function R(){
  var bd=cc(S.ckb);var valC=cntVals();var tp=P(bd+valC,ct(CKB)+22);
  var skins=getSkins();var sa=skins.filter(function(s){return s.ck();}).length;
  var totalV=S.corr.reduce(function(s,c){return s+c.v;},0)||S.mes.vendas;
  var meta=S.meta.vendas;
  document.getElementById('p-sem').textContent='Semana '+S.curSem;
  document.getElementById('p-skins').innerHTML='⚔️ <strong>'+sa+'/7</strong> skins';
  document.getElementById('p-meta').innerHTML='🎯 Meta: <strong>'+totalV+'/'+meta+'</strong>';
  document.getElementById('p-pct').innerHTML='<strong>'+tp+'%</strong> a fazer';
  document.getElementById('xp-lvl').textContent=Math.max(1,Math.floor(tp/15)+1);
  document.getElementById('xp-fill').style.width=tp+'%';
  document.getElementById('xp-txt').textContent=tp+'%';
  renderResumo(totalV,meta,skins,sa);
  renderChecklist();
  renderRecep();
  renderPastas();
  renderArsenal();
  renderOutbound();
  renderImob();
  renderConhecimento();
}

// ========== RESUMO (cascata + KPIs 2 linhas + ranking + skins) ==========
function renderResumo(totalV,meta,skins,sa){
  var c=calcCascade(meta);
  var realV=totalV,realP=S.mes.pastas,realVis=S.mes.visitas,realL=S.mes.leads;
  var st=function(real,target){var p=P(real,target);return p>=80?'ok':p>=50?'warn':'bad';};
  var stage=function(lbl,real,target){
    var s=st(real,target),pct=Math.min(100,P(real,target));
    return '<div class="cs-stage" data-st="'+s+'"><div class="cs-lbl">'+lbl+'</div>'+
      '<div class="cs-vals"><span class="cs-real">'+fmt(real)+'</span><span class="cs-sep">/</span><span class="cs-target">'+fmt(target)+'</span></div>'+
      '<div class="cs-bar"><div class="cs-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="cs-status '+s+'">'+(real>=target?'✅ Bateu':'Falta '+fmt(target-real))+'</div></div>';
  };
  var arrow='<div class="flow-arrow" aria-hidden="true"></div>';
  // gap analysis (acha o estágio mais atrasado)
  var stages=[{n:'leads',l:realL,t:c.leads},{n:'visitas',l:realVis,t:c.visitas},{n:'pastas',l:realP,t:c.pastas},{n:'vendas',l:realV,t:c.vendas}];
  var worst=stages.reduce(function(w,s){return P(s.l,s.t)<P(w.l,w.t)?s:w;});
  var insightCl='ok',insightTxt='✅ Funil saudável — todos os estágios no rumo da meta';
  var worstPct=P(worst.l,worst.t);
  if(worstPct<50){insightCl='bad';insightTxt='🚨 Gargalo crítico em <strong>'+worst.n+'</strong>: faltam '+fmt(worst.t-worst.l)+' para sustentar a meta';}
  else if(worstPct<80){insightCl='warn';insightTxt='⚠ Atenção em <strong>'+worst.n+'</strong>: faltam '+fmt(worst.t-worst.l)+' para bater a meta';}

  var h='<div class="cascade">'+
    '<div class="cascade-header">'+
      '<div><div class="cascade-title">🎯 Cascata da Meta — Semana '+S.curSem+'</div>'+
        '<div class="cascade-sub">Conversões usadas: '+(S.taxas.lv*100).toFixed(0)+'% lead→visita · '+(S.taxas.vp*100).toFixed(0)+'% visita→pasta · '+(S.taxas.pv*100).toFixed(0)+'% pasta→venda</div></div>'+
      '<div class="meta-edit-row"><label>Meta de vendas</label><input type="number" min="1" value="'+meta+'" oninput="setMetaVendas(this.value)"/></div>'+
    '</div>'+
    '<div class="cascade-row">'+
      stage('📡 Leads',realL,c.leads)+arrow+
      stage('🏠 Visitas',realVis,c.visitas)+arrow+
      stage('📂 Pastas',realP,c.pastas)+arrow+
      stage('🏆 Vendas',realV,c.vendas)+
    '</div>'+
    '<div class="cascade-insight '+insightCl+'">'+insightTxt+'</div>'+
  '</div>';

  // KPIs em 2 grupos (FUNIL + PERFORMANCE) — agora dentro de containers visuais
  var conv=realL>0?((realV/realL)*100).toFixed(2)+'%':'0%';
  h+='<div class="kpi-group kpi-group--funil">'+
    '<div class="kpi-group-header"><span class="grp-icon">📊</span><div><div class="kpi-group-title">Funil do período</div><div class="kpi-group-sub">Volume e conversão por etapa</div></div></div>'+
    '<div class="g4 funnel-flow">'+funnelHTML([
      {l:'Leads',v:fmt(realL),i:'📡',acc:'sky'},
      {l:'Visitas',v:fmt(realVis),i:'🏠',acc:'violet'},
      {l:'Pastas',v:fmt(realP),i:'📂',acc:'amber'}
    ])+funnelArrow()+
    '<div class="stat stat-hero"><div class="s-icon">🏆</div><div class="s-val">'+realV+' <span class="s-target">/'+meta+'</span></div><div class="s-lbl">Vendas</div></div>'+
    '</div>'+
  '</div>';

  h+='<div class="kpi-group kpi-group--perf">'+
    '<div class="kpi-group-header"><span class="grp-icon">⚡</span><div><div class="kpi-group-title">Performance</div><div class="kpi-group-sub">Eficiência e capacidade do time</div></div></div>'+
    '<div class="g4">'+statHTML([
      {l:'Conversão lead→venda',v:conv,i:'📈',acc:'rose'},
      {l:'Corretores ativos',v:S.mes.corretores,i:'👥'},
      {l:'VGV médio',v:'R$ '+fmt(Math.round(S.mes.ticketMedio/1000))+'k',i:'💎',acc:'emerald'},
      {l:'VGV no período',v:'R$ '+(S.mes.vgvReal/1000000).toFixed(2)+' mi',i:'💰',acc:'sky'}
    ])+'</div>'+
  '</div>';

  // Ranking corretores
  var ranked=S.corr.map(function(c2){return{nome:c2.nome,imob:c2.imob,ind:c2.ind,vis:c2.vis,pas:c2.pas,v:c2.v,pts:calcPts(c2)};}).sort(function(a,b){return b.pts-a.pts;});
  h+='<div class="card card--blue" style="margin-top:14px"><div class="card-title">🏆 Ranking — Semana '+S.curSem+'<span class="ct-meta">'+ranked.length+' corretores</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Corretor</th><th>Imob</th><th>Pts</th><th>Ind</th><th>Vis</th><th>Pas</th><th>Ven</th><th>Nível</th></tr></thead><tbody>';
  if(ranked.length===0)h+='<tr><td colspan="9" class="empty-state">Cadastre corretores em Armas</td></tr>';
  else ranked.forEach(function(c2,i){h+='<tr><td style="font-weight:700;color:var(--blue)">#'+(i+1)+'</td><td style="font-weight:600">'+c2.nome+'</td><td><span class="badge b-blue">'+c2.imob+'</span></td><td style="font-weight:700;color:var(--blue)">'+c2.pts+'</td><td>'+c2.ind+'</td><td>'+c2.vis+'</td><td>'+c2.pas+'</td><td style="font-weight:700">'+c2.v+'</td><td>'+nb(c2.pts)+'</td></tr>';});
  h+='</tbody></table></div></div>';

  // Skins do Comercial (compacto, no Resumo — antiga aba)
  h+='<div class="card card--violet"><div class="card-title">⚔️ Skins do Comercial<span class="ct-meta">'+sa+' / 7 desbloqueadas</span></div>';
  h+='<div class="prog" style="margin-bottom:14px"><div class="prog-fill" style="width:'+P(sa,7)+'%"></div></div>';
  h+='<div class="skins-grid">';
  skins.forEach(function(s){var u=s.ck();h+='<div class="sk-mini '+(u?'unlocked':'locked')+'"><div class="sk-mini-emoji">'+(u?'⚔️':'🔒')+'</div><div class="sk-mini-text"><div class="sk-mini-name">'+s.n+'</div><div class="sk-mini-desc">'+s.d+'</div></div></div>';});
  h+='</div></div>';

  // Regras de ouro
  h+='<div class="card regras-card"><div class="card-title">📜 Regras de Ouro</div>';
  REGRAS.forEach(function(r,i){h+='<div class="regra-item"><span class="regra-num">'+(i+1)+'</span><span>'+r+'</span></div>';});
  h+='</div>';

function validateLead(i){S.outLeads[i].validated=true;addSync('lead',S.outLeads[i]);R();}
function validateAllLeads(){S.outLeads.forEach(function(l){if(!l.validated){l.validated=true;addSync('lead',l);}});R();}
function validateROI(i){S.roi[i].validated=true;addSync('roi',S.roi[i]);R();}
function validateAllROI(){S.roi.forEach(function(r){if(!r.validated){r.validated=true;addSync('roi',r);}});R();}

function renderOutbound(){
  var stOpts=['Novo','Contatado','Agendado','Visitou','Pasta','Venda'];
  var acOpts='<option value="">— Selecione a ação —</option>';
  S.acoes.forEach(function(a){acOpts+='<option value="'+a.id+'">'+a.label+'</option>';});
  var sts={Novo:0,Contatado:0,Agendado:0,Visitou:0,Pasta:0,Venda:0};
  S.outLeads.forEach(function(l){if(sts[l.status]!==undefined)sts[l.status]++;});

  var h='<div class="g2"><div class="card card--orange"><div class="card-title">📥 Importar Leads</div><div class="form-group" style="margin-bottom:10px"><label>Vincular à ação</label><select id="ob-acao-link" style="width:100%">'+acOpts+'</select></div><label class="upload-area"><input type="file" accept=".xlsx,.xls,.csv"/><div style="font-size:26px;margin-bottom:6px">📥</div><div style="font-weight:600;color:var(--ink)">Importar planilha</div><div style="font-size:11px;color:var(--ink-muted);margin-top:4px">XLSX, XLS ou CSV</div></label></div>';

  h+='<div class="card card--blue"><div class="card-title">✏️ Cadastro Manual</div><div class="form-group" style="margin-bottom:8px"><label>Nome</label><input type="text" id="ob-nome" placeholder="Nome do lead" style="width:100%"/></div><div class="form-group" style="margin-bottom:8px"><label>Telefone</label><input type="text" id="ob-tel" placeholder="(00) 00000-0000" style="width:100%"/></div><div class="form-group" style="margin-bottom:8px"><label>Ação + Local</label><select id="ob-acao" style="width:100%">'+acOpts+'</select></div><div class="form-group" style="margin-bottom:10px"><label>Corretor</label><input type="text" id="ob-corr" placeholder="Corretor" style="width:100%"/></div><button class="btn btn-primary" onclick="addLead()" style="width:100%">+ Adicionar Lead</button></div></div>';

  // Apenas "Leads novos" (vem da planilha importada). Em contato / Visitaram / Venda já estão no funil do Resumo.
  h+='<div class="card card--sky" style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;margin-bottom:16px"><div><div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)">📡 Leads novos da ação</div><div style="font-size:11px;color:var(--ink-muted);margin-top:3px;font-weight:500">vindos da planilha importada</div></div><div style="font-size:42px;font-weight:700;color:var(--sky);letter-spacing:-.02em;line-height:1">'+sts.Novo+'</div></div>';

  // Tabela de leads
  h+='<div class="card"><div class="card-title">📊 Leads ('+S.outLeads.length+')<button class="btn btn-green btn-sm" style="margin-left:auto" onclick="validateAllLeads()">✅ Validar Todos</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Tel</th><th>Ação</th><th>Corretor</th><th>Status</th><th>Data</th><th>Base JV</th><th></th></tr></thead><tbody>';
  if(S.outLeads.length===0)h+='<tr><td colspan="8" class="empty-state">Nenhum lead cadastrado</td></tr>';
  else S.outLeads.forEach(function(l,i){var sel='';stOpts.forEach(function(s){sel+='<option'+(s===l.status?' selected':'')+'>'+s+'</option>';});h+='<tr><td style="font-weight:600">'+l.nome+'</td><td>'+l.tel+'</td><td><span class="badge b-orange">'+getAcaoLabel(l.acaoId)+'</span></td><td>'+l.corretor+'</td><td><select class="ob-status-sel" onchange="updSt('+i+',this.value)">'+sel+'</select></td><td style="font-size:11px;color:var(--ink-muted)">'+l.data+'</td><td>'+(l.validated?'<span class="validated-dot"></span> <span style="font-size:10px;color:var(--emerald);font-weight:600">Salvo</span>':'<button class="btn btn-green btn-sm" onclick="validateLead('+i+')">✅ Validar</button>')+'</td><td><button class="btn btn-red btn-sm" onclick="delLead('+i+')">✕</button></td></tr>';});
  h+='</tbody></table></div></div>';

  // ROI por Ação (movido do Resumo)
  h+='<div class="card card--emerald"><div class="card-title">💰 ROI por Ação<span class="ct-meta">conectado ao arsenal</span><button class="btn btn-green btn-sm" style="margin-left:14px" onclick="validateAllROI()">✅ Validar Todos</button></div>';
  h+='<div style="font-size:12px;color:var(--ink-light);background:var(--emerald-50);padding:12px 16px;border-radius:10px;border:1px solid var(--emerald-100);margin-bottom:14px;line-height:1.6">Preencha o custo planejado (antes da ação) e o custo real (após a execução). Leads / visitas / vendas vêm do sistema (CV + Base JV) e o ROI é calculado automaticamente.</div>';
  h+='<div class="table-wrap"><table><thead><tr><th>Ação</th><th>Custo Plan.</th><th>Custo Real</th><th>Leads</th><th>Vis</th><th>Ven</th><th>VGV</th><th>ROI</th><th>Base JV</th></tr></thead><tbody>';
  S.roi.forEach(function(r,i){var cost=r.custoReal>0?r.custoReal:r.custo;var roi=cost>0&&r.vgv>0?((r.vgv-cost)/cost*100).toFixed(0)+'%':'—';h+='<tr><td style="font-weight:600">'+r.acao+'</td><td><input type="number" value="'+(r.custo||0)+'" style="width:80px" onchange="S.roi['+i+'].custo=+this.value;S.roi['+i+'].validated=false;R()"/></td><td><input type="number" value="'+(r.custoReal||0)+'" style="width:80px" onchange="S.roi['+i+'].custoReal=+this.value;S.roi['+i+'].validated=false;R()"/></td><td>'+r.leads+'</td><td>'+r.vis+'</td><td style="font-weight:700">'+r.vendas+'</td><td>R$ '+fmt(r.vgv)+'</td><td style="font-weight:700;color:'+(r.vgv>0?'var(--emerald)':'var(--ink-muted)')+'">'+roi+'</td><td>'+(r.validated?'<span class="validated-dot"></span> <span style="font-size:10px;color:var(--emerald);font-weight:600">Salvo</span>':'<button class="btn btn-green btn-sm" onclick="validateROI('+i+')">✅ Validar</button>')+'</td></tr>';});
  h+='</tbody></table></div></div>';

  document.getElementById('t-outbound').innerHTML=h;
}

// ========== IMOBILIÁRIAS (sem produzindo, com nº corretores em destaque) ==========
function addImob(){var n=document.getElementById('imob-nome').value.trim();if(!n){alert('Preencha o nome!');return;}S.imobs.push({id:S.nextImobId++,nome:n,resp:document.getElementById('imob-resp').value.trim(),tel:document.getElementById('imob-tel').value.trim(),status:'prospect',corr:0,validated:false});document.getElementById('imob-nome').value='';document.getElementById('imob-resp').value='';document.getElementById('imob-tel').value='';R();}
function setImobSt(id,st){var im=S.imobs.find(function(x){return x.id===id;});if(im){im.status=st;im.validated=false;}R();}
function delImob(id){S.imobs=S.imobs.filter(function(x){return x.id!==id;});R();}
function setImobCorr(id,v){var im=S.imobs.find(function(x){return x.id===id;});if(im){im.corr=+v;im.validated=false;}R();}
function validateImob(id){var im=S.imobs.find(function(x){return x.id===id;});if(im){im.validated=true;addSync('imob',im);}R();}
function validateAllImobs(){S.imobs.forEach(function(i){if(!i.validated){i.validated=true;addSync('imob',i);}});R();}
function renderImob(){
  var totalCorr=S.imobs.reduce(function(s,i){return s+i.corr;},0);
  var counts={};
  IMOB_STATUS.forEach(function(s){counts[s]=S.imobs.filter(function(i){return i.status===s;}).length;});

  var h='<div class="card card--violet"><div class="card-title">🏢 Cadastrar Imobiliária</div><div style="display:grid;grid-template-columns:2fr 2fr 1.5fr auto;gap:10px;align-items:end"><div class="form-group"><label>Nome</label><input type="text" id="imob-nome" placeholder="Ex: VENDEU" style="width:100%"/></div><div class="form-group"><label>Responsável</label><input type="text" id="imob-resp" placeholder="Gerente" style="width:100%"/></div><div class="form-group"><label>Telefone</label><input type="text" id="imob-tel" placeholder="(11)..." style="width:100%"/></div><button class="btn btn-primary" onclick="addImob()" style="height:36px">+ Adicionar</button></div></div>';

  // Funil prospect → visita → acordo → ativa
  h+='<div class="kpi-group kpi-group--funnel-imob">'+
    '<div class="kpi-group-header"><span class="grp-icon">🔄</span><div><div class="kpi-group-title">Funil de captação</div><div class="kpi-group-sub">Status das imobiliárias parceiras</div></div></div>'+
    '<div class="g4 funnel-flow">'+funnelHTML([
      {l:'🔍 Prospect',v:counts.prospect||0,i:'🔍'},
      {l:'🏠 Visita',v:counts.visita||0,i:'🏠',acc:'amber'},
      {l:'🤝 Acordo',v:counts.acordo||0,i:'🤝',acc:'violet'},
      {l:'✅ Ativa',v:counts.ativa||0,i:'✅',acc:'emerald'}
    ])+'</div>'+
  '</div>';

  // Capacidade — corretores total separado
  h+='<div class="kpi-group kpi-group--cap-imob">'+
    '<div class="kpi-group-header"><span class="grp-icon">👥</span><div><div class="kpi-group-title">Capacidade</div><div class="kpi-group-sub">Tamanho da rede de parceiros</div></div></div>'+
    '<div class="g3">'+statHTML([
      {l:'Total imobiliárias',v:S.imobs.length,i:'🏢',acc:'sky'},
      {l:'Total de corretores',v:totalCorr,i:'👥',acc:'violet'},
      {l:'Imobiliárias ativas',v:counts.ativa||0,i:'⭐',acc:'emerald'}
    ])+'</div>'+
  '</div>';

  // Lista
  h+='<div class="card"><div class="card-title">🏢 Imobiliárias ('+S.imobs.length+')<button class="btn btn-green btn-sm" style="margin-left:auto" onclick="validateAllImobs()">✅ Validar Todas</button></div>';
  if(S.imobs.length===0)h+='<div class="empty-state">Nenhuma imobiliária cadastrada</div>';
  else S.imobs.forEach(function(im){
    var stSel='';IMOB_STATUS.forEach(function(s){stSel+='<option'+(s===im.status?' selected':'')+'>'+s+'</option>';});
    h+='<div class="imob-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><div style="font-size:14px;font-weight:700;color:var(--blue-deep)">'+im.nome+'</div><div style="font-size:11px;color:var(--ink-muted);margin-top:2px">'+im.resp+' · '+im.tel+'</div></div><div style="display:flex;gap:10px;align-items:center"><div class="form-group"><label>Corretores</label><input type="number" min="0" value="'+im.corr+'" style="width:60px" onchange="setImobCorr('+im.id+',this.value)"/></div><select class="ob-status-sel" onchange="setImobSt('+im.id+',this.value)">'+stSel+'</select>'+(im.validated?'<span class="validated-dot" title="Salvo na Base JV"></span><span style="font-size:10px;color:var(--emerald);font-weight:600">Salvo</span>':'<button class="btn btn-green btn-sm" onclick="validateImob('+im.id+')">✅ Validar</button>')+'<button class="btn btn-red btn-sm" onclick="delImob('+im.id+')">✕</button></div></div></div>';
  });
  h+='</div>';
  document.getElementById('t-imob').innerHTML=h;
}

// ========== CONHECIMENTO (sub-tabs claras) ==========
function renderConhecimento(){
  var sub=S.knSub;
  var h='<div class="sub-tabs">'+
    '<button class="sub-tab'+(sub==='acoes'?' on--teal':'')+'" onclick="setKnSub(\'acoes\')">🎪 Ações de Campo</button>'+
    '<button class="sub-tab'+(sub==='treinos'?' on--violet':'')+'" onclick="setKnSub(\'treinos\')">🏋️ Treinamentos</button>'+
    '<button class="sub-tab'+(sub==='objecoes'?' on--rose':'')+'" onclick="setKnSub(\'objecoes\')">🎭 Objeções de Venda</button>'+
  '</div>';

  if(sub==='acoes'){
    h+='<div class="card card--orange"><div class="card-title">🎪 Catálogo de Ações de Campo</div><div style="font-size:12px;color:var(--ink-light);margin-bottom:16px;background:var(--orange-50);padding:12px 16px;border-radius:10px;line-height:1.6;border:1px solid var(--orange-100)">Cada ação tem objetivo estratégico claro. Escolha as ações certas para o momento do empreendimento e registre no Arsenal após executar.</div>';
    ARS.filter(function(a){return a.tp==='acao';}).forEach(function(a){
      h+='<div class="kn-card" style="border-left:4px solid '+a.cl+'"><div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--blue-deep)">'+a.n+'</div>';
      h+='<div class="kn-row"><span class="kn-label">O que é</span><span class="kn-val">'+a.d+'</span></div>';
      if(a.c)h+='<div class="kn-row"><span class="kn-label">Custo médio</span><span class="kn-val" style="color:var(--orange);font-weight:600">'+a.c+'</span></div>';
      h+='<div class="kn-row"><span class="kn-label">Resultado</span><span class="kn-val" style="color:var(--emerald);font-weight:600">'+a.p+'</span></div>';
      if(a.det)h+='<div class="kn-row"><span class="kn-label">Como executar</span><span class="kn-val" style="line-height:1.7">'+a.det+'</span></div>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(sub==='treinos'){
    h+='<div class="card card--violet"><div class="card-title">🏋️ Catálogo de Treinamentos</div><div style="font-size:12px;color:var(--ink-light);margin-bottom:16px;background:var(--violet-50);padding:12px 16px;border-radius:10px;line-height:1.7;border:1px solid var(--violet-100)"><strong style="color:#5b21b6">📅 Terças e quintas:</strong> treinamentos técnicos + corujões.<br><strong style="color:#5b21b6">📅 Diário:</strong> treinamentos relâmpago em janelas ociosas (Alvo do Dia, Duelos, Sino).</div>';
    ARS.filter(function(a){return a.tp==='treinamento';}).forEach(function(a){
      h+='<div class="kn-card" style="border-left:4px solid '+a.cl+'"><div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--blue-deep)">'+a.n+'</div>';
      h+='<div class="kn-row"><span class="kn-label">Dinâmica</span><span class="kn-val">'+a.d+'</span></div>';
      h+='<div class="kn-row"><span class="kn-label">Prêmio</span><span class="kn-val" style="color:var(--emerald);font-weight:600">'+a.p+'</span></div>';
      if(a.det)h+='<div class="kn-row"><span class="kn-label">Como aplicar</span><span class="kn-val" style="line-height:1.7">'+a.det+'</span></div>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(sub==='objecoes'){
    h+='<div class="card card--rose"><div class="card-title">🎭 Guia de Objeções de Venda</div><div style="font-size:12px;color:var(--ink-light);margin-bottom:16px;background:var(--rose-50);padding:12px 16px;border-radius:10px;line-height:1.7;border:1px solid var(--rose-100)"><strong style="color:#9f1239">📌 Referência para Roleplay Objeções.</strong> Use nas terças e quintas. Corretor que domina essas respostas fecha mais.</div>';
    OBJECOES.forEach(function(o,i){
      var tc=o.tipo==='Preço'?'b-red':o.tipo==='Adiamento'?'b-gold':o.tipo==='Financeiro'?'b-orange':o.tipo==='Concorrência'?'b-blue':o.tipo==='Segurança'?'b-pink':'b-violet';
      h+='<div class="kn-card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-50);width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center">'+(i+1)+'</span><span class="obj-badge '+tc+'">'+o.tipo+'</span></div>';
      h+='<div class="kn-row"><span class="kn-label">Objeção</span><span class="kn-val" style="font-weight:700;font-size:14px;color:var(--blue-deep)">"'+o.obj+'"</span></div>';
      h+='<div class="kn-row"><span class="kn-label">Contexto</span><span class="kn-val" style="color:var(--ink-light)">'+o.ctx+'</span></div>';
      h+='<div class="kn-row"><span class="kn-label">Resposta</span><span class="kn-val" style="line-height:1.7;background:var(--emerald-50);padding:12px 14px;border-radius:8px;border:1px solid var(--emerald-100)">'+o.resp+'</span></div></div>';
    });
    h+='</div>';
  }
  document.getElementById('t-conhecimento').innerHTML=h;
}

// ========== BOOT ==========
init();R();
</script>
</body>
</html>
